name: 缺陷报告
description: 报告不包含敏感信息的可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        不要填写账号、密码、Cookie、MAC、学号、抓包内容或未经脱敏的日志。安全问题请使用私人漏洞报告。
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他或未知
    validations:
      required: true
  - type: dropdown
    id: portal
    attributes:
      label: 浏览器手动登录时是否使用 10.9.10.100
      options:
        - 是
        - 否
        - 不确定
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际现象与预期现象
      description: 请描述步骤，不要粘贴真实凭据或完整网页内容。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断报告
      description: 可粘贴 diagnose 生成的 JSON；提交前请再次人工检查。
      render: json

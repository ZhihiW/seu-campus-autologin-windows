name: 功能建议
description: 提出兼容性或使用体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 请勿提交账号、密码、Cookie、学号或未经脱敏的日志。
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: 是否涉及新增登录地址或凭据处理
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true

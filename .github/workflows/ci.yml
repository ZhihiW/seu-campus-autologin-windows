name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: python -m pip install -e ".[dev]"

      - name: 静态检查
        run: python -m ruff check .

      - name: 单元测试
        run: python -m pytest --cov=seu_autologin --cov-report=term-missing
